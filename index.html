<!DOCTYPE html>
<html lang="es-PE">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yape Listener — Financial Dashboard</title>
  <link rel="stylesheet" href="./css/styles.css">
</head>
<body>

  <div id="lock-screen">
    <p style="color:var(--text-secondary); font-size:0.9rem;">Ingresa tu sede y clave</p>
    <input id="lock-sede-id" type="text" placeholder="Sede (ej: qf_lima)" style="background: var(--panel-bg); border: 1px solid var(--panel-border); color: var(--text-primary); padding: 10px 14px; border-radius: 8px; font-size: 0.95rem; text-align: center;" />
    <input id="lock-input" type="password" placeholder="Contraseña" />
    <button id="lock-btn" class="btn">Entrar</button>
    <p id="lock-error" style="color:#f87171; font-size:0.8rem; display:none;">Clave incorrecta</p>
  </div>

  <header>
    <div class="brand-group">
      <h1 id="view-title">Yape Monitor</h1>
      <div id="live-indicator" class="status-badge">
        <span class="status-dot"></span> En Vivo
      </div>
    </div>

    <div id="total-day-card" class="summary-pill">
      <span class="summary-label">Hoy:</span>
      <strong id="total-day-amount" class="summary-val">S/ 0.00</strong>
    </div>

    <div style="display:flex; gap:8px;">
      <button id="sound-btn" class="btn btn-secondary">🔇</button>
      <button id="logout-btn" class="btn btn-secondary">Salir</button>
    </div>
  </header>

  <main id="app"></main>

  <script type="module" src="./js/auth.js"></script>
</body>
</html>
